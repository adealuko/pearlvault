dialog{border:0;border-radius:18px;padding:18px;width:min(560px,calc(100% - 24px));background:var(--c);color:var(--ink);max-height:90vh}
dialog::backdrop{background:rgba(5,10,20,.55)}

.lg{grid-column:1/-1;min-height:100vh;display:grid;grid-template-columns:1fr 1fr}.lg .l{background:var(--g);color:#fff;padding:60px 44px;display:flex;flex-direction:column;justify-content:center;gap:12px}.lg .r{display:flex;align-items:center;justify-content:center;padding:24px}.lg .card{width:min(420px,100%);margin:0}
@media(max-width:820px){.lg{grid-template-columns:1fr}.lg .l{padding:28px 20px}.app{grid-template-columns:1fr}aside{position:static;height:auto;padding:10px}.logo{display:none}nav{flex-direction:row;overflow-x:auto}.two{grid-template-columns:1fr}.main{padding:0 12px 40px}.fg,.kv{grid-template-columns:1fr}}
@media print{body>*:not(dialog){display:none!important}dialog{position:absolute;inset:0;width:100%;max-height:none;border-radius:0}.noprint{display:none!important}}
